      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 빌드
        working-directory: proj
        run: gradle --no-daemon assembleRelease
      - name: APK 꺼내기
        run: cp proj/app/build/outputs/apk/release/app-release.apk EnchantHelper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EnchantHelper-apk
          path: EnchantHelper.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: enchant-${{ github.run_number }}
          name: 마력부여 도우미 build ${{ github.run_number }}
          files: EnchantHelper.apk
          body: "폰에서 EnchantHelper.apk 를 눌러 내려받아 설치하세요."
